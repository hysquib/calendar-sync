version: '3.8'

services:
  calendar-sync:
    build: .
    container_name: calendar-sync
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - radicale
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: calendar-sync-radicale
    restart: unless-stopped
    ports:
      - "5232:5232"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./radicale/data:/data
      - ./radicale/config:/config:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5232/')"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
