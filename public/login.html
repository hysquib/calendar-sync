<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 日历同步管理后台</title>
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --bg-page: #f5f7fa;
      --text-primary: #333;
      --text-secondary: #555;
      --text-muted: #999;
      --border-color: #e0e0e0;
      --border-light: #f0f0f0;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --shadow-card: 0 20px 60px rgba(0,0,0,0.3);
      --shadow-hover: 0 4px 12px rgba(102, 126, 234, 0.4);
      --success: #52c41a;
      --error: #ff4d4f;
      --info: #1890ff;
      --transition: 0.2s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 背景装饰 */
    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      top: -200px;
      right: -200px;
      animation: float 8s ease-in-out infinite;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      bottom: -150px;
      left: -150px;
      animation: float 10s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 20px); }
    }

    .login-box {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-card);
      animation: slideUp 0.5s ease;
      position: relative;
      z-index: 1;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: var(--bg-gradient);
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      margin-bottom: 16px;
      animation: logoIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
    }
    @keyframes logoIn {
      0% { opacity: 0; transform: scale(0) rotate(-180deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .logo h1 {
      font-size: 20px;
      color: var(--text-primary);
      font-weight: 600;
      animation: fadeIn 0.8s ease 0.2s both;
    }
    .logo p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
      animation: fadeIn 0.8s ease 0.4s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 20px;
      animation: fadeIn 0.6s ease 0.5s both;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .input-wrap {
      position: relative;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 15px;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
      transform: translateY(-1px);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--bg-gradient);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      animation: fadeIn 0.6s ease 0.6s both;
      font-family: inherit;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error-msg {
      background: #fee;
      color: var(--error);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .error-msg.show { display: block; }

    .tip {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 20px;
      animation: fadeIn 0.6s ease 0.7s both;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">📅</div>
      <h1>日历同步管理后台</h1>
      <p>喜鹊儿 · 教务系统 · 企业微信 · CalDAV</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>管理密码</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="请输入管理密码" autofocus>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">登 录</button>
    </form>

    <p class="tip">默认密码：admin123（请登录后及时修改）</p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const btnLogin = document.getElementById('btnLogin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = passwordInput.value.trim();

      if (!password) {
        showError('请输入密码');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = '登录中...';
      hideError();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('auth_token', data.token);
          window.location.href = '/';
        } else {
          showError(data.error || '登录失败');
        }
      } catch (err) {
        showError('网络错误，请稍后重试');
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = '登 录';
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }

    function hideError() {
      errorMsg.classList.remove('show');
    }
  </script>
</body>
</html>
